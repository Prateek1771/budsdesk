name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BudsDesk-windows
          - os: macos-latest
            artifact: BudsDesk-macos
          - os: ubuntu-22.04
            artifact: BudsDesk-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # setup-python's Linux builds lack Bluetooth sockets, so Linux uses Ubuntu's own python3
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Linux python + Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libegl1 libxkbcommon-x11-0 libxcb-cursor0
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow  # pillow: icon conversion

      - name: Self-checks
        run: |
          python -c "import socket, sys; assert sys.platform == 'darwin' or hasattr(socket, 'AF_BLUETOOTH'), 'no AF_BLUETOOTH'"
          python models.py
          python buds.py
          python platform_bt.py

      - name: Build
        run: python -m PyInstaller --noconfirm budsdesk.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          & $iscc /Qp "/DVersion=$v" installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/BudsDesk-Setup.exe, dist/BudsDesk.exe pkg/
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg pkg && cp -R dist/BudsDesk.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname BudsDesk -srcfolder dmg -ov -format UDZO pkg/BudsDesk.dmg
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/BudsDesk pkg && cp dist/BudsDesk ui/icon.png stage/BudsDesk/
          tar -czf pkg/BudsDesk-linux.tar.gz -C stage BudsDesk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pkg/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: pkg/*
          generate_release_notes: true
    permissions:
      contents: write
