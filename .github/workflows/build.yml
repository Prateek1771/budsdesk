name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BudsDesk-windows
          - os: macos-latest
            artifact: BudsDesk-macos
          - os: ubuntu-22.04
            artifact: BudsDesk-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # setup-python's Linux builds lack Bluetooth sockets, so Linux uses Ubuntu's own python3
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Linux python + Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libegl1 libxkbcommon-x11-0 libxcb-cursor0
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Self-checks
        run: |
          python -c "import socket, sys; assert sys.platform == 'darwin' or hasattr(socket, 'AF_BLUETOOTH'), 'no AF_BLUETOOTH'"
          python models.py
          python buds.py
          python platform_bt.py

      - name: Build
        run: python -m PyInstaller --noconfirm budsdesk.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/BudsDesk.exe -DestinationPath ${{ matrix.artifact }}.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/BudsDesk.app ${{ matrix.artifact }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist BudsDesk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.artifact }}.*
    permissions:
      contents: write
