name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BudsDesk-windows
          - os: macos-latest
            artifact: BudsDesk-macos
          - os: ubuntu-22.04
            artifact: BudsDesk-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # setup-python's Linux builds lack Bluetooth sockets, so Linux uses Ubuntu's own python3
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Linux python + Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-util1
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow  # pillow: icon conversion

      - name: Self-checks
        run: |
          python -c "import socket, sys; assert sys.platform == 'darwin' or hasattr(socket, 'AF_BLUETOOTH'), 'no AF_BLUETOOTH'"
          python models.py
          python buds.py
          python platform_bt.py

      - name: Build
        run: python -m PyInstaller --noconfirm budsdesk.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          & $iscc /Qp "/DVersion=$v" installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/BudsDesk-Setup.exe, dist/BudsDesk.exe pkg/
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg pkg && cp -R dist/BudsDesk.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname BudsDesk -srcfolder dmg -ov -format UDZO pkg/BudsDesk.dmg
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/BudsDesk pkg && cp dist/BudsDesk ui/icon.png stage/BudsDesk/
          tar -czf pkg/BudsDesk-linux.tar.gz -C stage BudsDesk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pkg/*


  # Launch the Linux build on a NEWER distro than it was built on (issue #1: bundled old libstdc++ broke
  # GPU drivers on Arch). Passes only if the window process is still alive when timeout stops it.
  smoke-linux:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BudsDesk-linux
      - name: Install a desktop-like runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libnss3 libasound2t64 libfontconfig1 libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1
      - name: Launch for 25 s
        run: |
          tar -xzf BudsDesk-linux.tar.gz
          set +e
          QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb xvfb-run -a timeout 25 ./BudsDesk/BudsDesk > run.log 2>&1
          code=$?
          set -e
          cat run.log
          [ "$code" = 124 ] || { echo "::error::BudsDesk exited early (code $code)"; exit 1; }
          if grep -qiE "GLIBCXX|version .* not found|Traceback" run.log; then echo "::error::bad lines in log"; exit 1; fi

  # Same idea on Windows: v1.0.2 crashed at launch (bad window icon) and only a real start catches that.
  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BudsDesk-windows
      - name: Launch for 25 s
        shell: pwsh
        run: |
          $t0 = Get-Date
          Start-Process ./BudsDesk.exe
          Start-Sleep 25
          $procs = @(Get-Process BudsDesk -ErrorAction SilentlyContinue)
          $win = $procs | Where-Object MainWindowTitle -eq "BudsDesk"
          $crash = @(Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$t0} -ErrorAction SilentlyContinue | Where-Object { $_.Message -match "BudsDesk" })
          $crash | ForEach-Object { $_.Message }
          $procs | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $procs) { Write-Error "BudsDesk exited early"; exit 1 }
          if ($crash.Count) { Write-Error "crash logged"; exit 1 }
          if (-not $win) { Write-Warning "no window titled BudsDesk found (headless runner?)" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-linux, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: pkg/*
          generate_release_notes: true
